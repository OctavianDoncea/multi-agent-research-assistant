services:
  - type: web
    name: multi-agent-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Required for Vercel (or any other origin) calling this API with cookies.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_PARTITIONED
        value: "false"
      - key: CORS_ORIGINS
        sync: false